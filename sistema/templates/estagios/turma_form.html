{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if turma else 'Nova' }} Turma{% endblock %}
{% block conteudo %}
<div class="topo-pagina"><h1>{{ 'Editar turma' if turma else 'Nova turma' }}</h1></div>

<form method="POST" class="form-grid">
  <div class="full">
    <label>Estágio / turno</label>
    <input type="text" name="estagio_turno" required value="{{ turma.estagio_turno if turma else '' }}">
  </div>
  <div>
    <label>Documento de referência</label>
    <input type="text" name="doc_ref" value="{{ turma.doc_ref if turma else '' }}">
  </div>
  <div>
    <label>Data do documento</label>
    <input type="date" name="dt_doc_ref" value="{{ turma.dt_doc_ref if turma else '' }}">
  </div>
  <div>
    <label>Prazo para indicação</label>
    <input type="date" name="prazo_indicacao" value="{{ turma.prazo_indicacao if turma else '' }}">
  </div>
  <div>
    <label>Encaminhamento</label>
    <input type="text" name="encaminhamento" value="{{ turma.encaminhamento if turma else '' }}">
  </div>
  <div>
    <label>Início EAD</label>
    <input type="date" name="dt_inicio_ead" value="{{ turma.dt_inicio_ead if turma else '' }}">
  </div>
  <div>
    <label>Fim EAD</label>
    <input type="date" name="dt_fim_ead" value="{{ turma.dt_fim_ead if turma else '' }}">
  </div>
  <div>
    <label>Início presencial</label>
    <input type="date" name="dt_inicio_presencial" value="{{ turma.dt_inicio_presencial if turma else '' }}">
  </div>
  <div>
    <label>Fim presencial</label>
    <input type="date" name="dt_fim_presencial" value="{{ turma.dt_fim_presencial if turma else '' }}">
  </div>
  <div class="full acoes-form">
    <button class="btn" type="submit">Salvar</button>
    <a class="btn btn-secundario" href="{{ url_for('estagios.listar_turmas') }}">Cancelar</a>
    {% if turma %}
    <form method="POST" action="{{ url_for('estagios.excluir_turma', turma_id=turma.id) }}" onsubmit="return confirm('Excluir esta turma e todos os participantes?');">
      <button class="btn btn-perigo" type="submit">Excluir</button>
    </form>
    {% endif %}
  </div>
</form>
{% endblock %}
