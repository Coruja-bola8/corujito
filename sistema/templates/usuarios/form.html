{% extends "base.html" %}
{% block titulo %}Usuário{% endblock %}
{% block conteudo %}
<div class="topo-pagina"><h1>{{ 'Editar' if usuario else 'Novo' }} usuário</h1></div>

<form method="POST" class="form-grid">
  <div>
    <label>Nome completo</label>
    <input type="text" name="nome_completo" required value="{{ usuario.nome_completo if usuario else '' }}">
  </div>
  <div>
    <label>Usuário (login)</label>
    <input type="text" name="username" required value="{{ usuario.username if usuario else '' }}">
  </div>
  <div>
    <label>Papel</label>
    <select name="papel">
      <option value="viewer" {{ 'selected' if usuario and usuario.papel == 'viewer' else '' }}>Somente leitura</option>
      <option value="admin" {{ 'selected' if usuario and usuario.papel == 'admin' else '' }}>Administrador (edita tudo)</option>
    </select>
  </div>
  <div>
    <label>{{ 'Nova senha (deixe em branco para manter)' if usuario else 'Senha' }}</label>
    <input type="password" name="senha" {{ 'required' if not usuario else '' }}>
  </div>
  {% if usuario %}
  <div>
    <label>Ativo</label>
    <select name="ativo">
      <option value="1" {{ 'selected' if usuario.ativo else '' }}>Sim</option>
      <option value="" {{ 'selected' if not usuario.ativo else '' }}>Não (bloqueado)</option>
    </select>
  </div>
  {% endif %}
  <div class="full acoes-form">
    <button class="btn" type="submit">Salvar</button>
    <a class="btn btn-secundario" href="{{ url_for('usuarios.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
