{% extends "base.html" %}
{% block titulo %}Condecoração{% endblock %}
{% block conteudo %}
<div class="topo-pagina"><h1>{{ 'Editar' if registro else 'Nova' }} condecoração</h1></div>

<form method="POST" class="form-grid">
  <div class="full">
    <label>Militar</label>
    <select name="militar_id" required>
      <option value="">-- selecione --</option>
      {% for m in militares %}
      <option value="{{ m.id }}" {{ 'selected' if (registro and registro.militar_id == m.id) or militar_id == m.id else '' }}>{{ m.nome }} ({{ m.posto_grad }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="full">
    <label>Medalha/Condecoração</label>
    <input type="text" name="medalha" required value="{{ registro.medalha if registro else '' }}">
  </div>
  <div>
    <label>Data de concessão</label>
    <input type="date" name="data_concessao" value="{{ registro.data_concessao if registro else '' }}">
  </div>
  <div>
    <label>Órgão concessor</label>
    <input type="text" name="orgao_concessor" value="{{ registro.orgao_concessor if registro else '' }}">
  </div>
  <div class="full">
    <label>Observações</label>
    <textarea name="observacoes" rows="3">{{ registro.observacoes if registro else '' }}</textarea>
  </div>
  <div class="full acoes-form">
    <button class="btn" type="submit">Salvar</button>
    <a class="btn btn-secundario" href="{{ url_for('condecoracoes.listar') }}">Cancelar</a>
    {% if registro %}
    <form method="POST" action="{{ url_for('condecoracoes.excluir', registro_id=registro.id) }}" onsubmit="return confirm('Excluir esta condecoração?');">
      <button class="btn btn-perigo" type="submit">Excluir</button>
    </form>
    {% endif %}
  </div>
</form>
{% endblock %}
